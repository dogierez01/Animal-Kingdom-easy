    function renderList() {
        if (!list) return;
        list.innerHTML = db.map((item, i) => {
            if (currentMode === 'learn') {
                return `
                    <div class="card" style="border-left:5px solid #4dabf7;">
                        <div class="card-title">${item.title}</div>
                        <div style="display:flex; gap:10px;">
                            <button onclick="playAudioOnly(${i}, 'female')" style="flex:1; padding:12px; background:#e056fd; color:#fff; border:none; border-radius:8px; cursor:pointer; font-weight:bold; font-size:16px;">👩 Listen</button>
                            <button onclick="openReadMode(${i})" style="flex:1; padding:12px; background:#4dabf7; color:#000; border:none; border-radius:8px; cursor:pointer; font-weight:bold; font-size:16px;">📜 Read Story</button>
                        </div>
                    </div>`;
            } else {
                return `
                    <div class="card" onclick="openQuizMode(${i})" style="cursor:pointer; border-left: 5px solid #e056fd;">
                        <div class="card-title">${item.title}</div>
                        <div style="font-size:14px; color:#aaa; margin-top:5px;">Tap to start True/False Quiz (6 Questions) 🧠</div>
                    </div>`;
            }
        }).join('');
    }

    function setMode(mode) {
        currentMode = mode;
        document.getElementById('btn-learn').className = (mode === 'learn') ? 'toggle-btn active' : 'toggle-btn';
        document.getElementById('btn-quiz').className = (mode === 'quiz') ? 'toggle-btn active' : 'toggle-btn';
        if(modal.style.display === "block") {
            document.getElementById('view-learn').style.display = (mode === 'learn') ? 'block' : 'none';
            document.getElementById('view-quiz').style.display = (mode === 'quiz') ? 'block' : 'none';
        }
        renderList();
    }

    function playSmartAudio(index, gender) {
        const item = db[index];
        const USER = "dogierez01"; 
        const REPO = "Animal-Kingdom-easy"; 
        const BASE_URL = `https://raw.githubusercontent.com/${USER}/${REPO}/main/`;
        
        let fileName = "";
        
        // Use exact hardcoded overrides for the specific broken ones!
        if (gender === 'female' && item.audioFemale) {
            fileName = item.audioFemale;
        } else if (gender === 'male' && item.audioMale) {
            fileName = item.audioMale;
        } else {
            // For the normal ones, just take the perfectly capitalized Title + " gender.wav"
            fileName = item.title + " " + gender + ".wav";
        }
        
        // Stop double encoding! If the file already has "%" in it, just stick it on the end.
        let finalUrl = "";
        if (fileName.includes("%")) {
            finalUrl = BASE_URL + fileName;
        } else {
            finalUrl = BASE_URL + encodeURIComponent(fileName);
        }

        player.src = finalUrl;
        player.playbackRate = isSlowMode ? 0.8 : 1.0;
        player.play().catch(e => console.log("Failed to load: " + finalUrl));
    }

    function playAudioOnly(i, gender) { 
        playSmartAudio(i, gender); 
    }

    function openReadMode(i) {
        currentDataIndex = i;
        const item = db[i];
        modal.style.display = "block";
        document.getElementById('story-title').innerText = item.title;
        document.getElementById('view-learn').style.display = 'block';
        document.getElementById('view-quiz').style.display = 'none';
        
        document.getElementById('story-text').innerHTML = `<div>${item.text}</div>`;
        playSmartAudio(i, 'male');
    }

        player.pause(); 
        
        document.getElementById('quiz-area').innerHTML = item.questions.map((q, idx) => `
            <div class="quiz-q">
                <div style="font-weight:bold; margin-bottom:15px; font-size: 20px; line-height: 1.4; color: #fff;">Q${idx + 1}: ${q.q}</div>
                <div style="display:flex; gap:10px;">
                    <button class="btn-tf btn-true" onclick="checkAnswer(this, ${q.a}, true)">TRUE</button>
                    <button class="btn-tf btn-false" onclick="checkAnswer(this, ${q.a}, false)">FALSE</button>
                </div>
                <div class="feedback"></div>
            </div>`).join('');
    }

    function checkAnswer(btn, ans, userAns) {
        const quizBox = btn.parentElement.parentElement;
        const fb = quizBox.querySelector('.feedback');
        
        if (ans === userAns) { 
            fb.innerHTML = "<span style='color: #39ff14;'>✅ CORRECT!</span>"; 
        } else { 
            fb.innerHTML = "<span style='color: #ff0033;'>❌ WRONG!</span>"; 
        }
        
        const buttons = quizBox.querySelectorAll('.btn-tf');
        buttons.forEach(b => { b.disabled = true; b.style.opacity = '0.5'; b.style.cursor = 'not-allowed'; });
        
        questionsAnsweredInCurrentQuiz++;
        
        if (questionsAnsweredInCurrentQuiz === db[currentDataIndex].questions.length) {
            document.getElementById('quiz-next-btn').style.display = "block";
        }
    }

    function nextQuizQuestion() {
        if (currentDataIndex + 1 < db.length) {
            openQuizMode(currentDataIndex + 1);
            document.getElementById('modal').scrollTop = 0;
        } else {
            document.getElementById('story-title').innerText = "Awesome Job!";
            document.getElementById('quiz-next-btn').style.display = "none";
            document.getElementById('quiz-area').innerHTML = `
                <div style="text-align:center; padding: 40px;">
                    <div style="font-size: 60px; margin-bottom: 20px;">🏆</div>
                    <div style="font-size: 32px; color: #39ff14; font-weight: 900;">QUIZ COMPLETE!</div>
                    <div style="color: #ccc; margin-top: 15px; font-size: 20px;">You've finished all 216 questions!</div>
                    <button onclick="closeModal()" style="margin-top: 40px; padding: 15px 40px; background: #e056fd; color: white; border: none; border-radius: 8px; font-size: 20px; font-weight: bold; cursor: pointer; transition: transform 0.1s;" onmousedown="this.style.transform='scale(0.95)'" onmouseup="this.style.transform='scale(1)'">Back to Menu</button>
                </div>`;
        }
    }

    function closeModal() { modal.style.display = "none"; player.pause(); }

    function toggleSnail() {
        isSlowMode = !isSlowMode;
        player.playbackRate = isSlowMode ? 0.8 : 1.0;
        snailBtn.classList.toggle('active');
    }

    renderList();
</script>
</body>
</html>
