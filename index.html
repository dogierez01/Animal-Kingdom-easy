<div id="content-quiz">
        <div id="quiz-container">
            <div id="quiz-header">
                <span id="quiz-progress">Animal 1 / 26</span>
                <span id="quiz-score">Score: 0</span>
            </div>
            <h2 id="quiz-title">Title</h2>
            <p id="quiz-text">Reading passage goes here...</p>
            
            <div id="quiz-question-box">
                <p id="quiz-question">Question goes here?</p>
                <div class="quiz-buttons">
                    <button class="btn-tf btn-true" onclick="checkAnswer(true)">TRUE</button>
                    <button class="btn-tf btn-false" onclick="checkAnswer(false)">FALSE</button>
                </div>
            </div>
            
            <div id="quiz-feedback"></div>
            <button id="next-quiz-btn" onclick="nextQuestion()">Next Animal ➔</button>
        </div>
    </div>
